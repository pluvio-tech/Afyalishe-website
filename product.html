  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const relatedGrid = document.getElementById('related-products-grid');
      if (relatedGrid) {
        const params = new URLSearchParams(window.location.search);
        const currentId = params.get('id') || 'chia-oil';
        const others = window.AFYALISHE_STORE.products.filter(p => p.id !== currentId).slice(0, 3);
        let html = '';
        others.forEach(p => {
          html += window.AFYALISHE_APP.buildProductCardHtml(p);
        });
        relatedGrid.innerHTML = html;
        window.AFYALISHE_APP.rebindMotion();
      }
    });
  </script>
